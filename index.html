<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘의 핫딜 모아보기</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #eef0f5;
      color: #333;
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
    }

    /* 헤더 영역 */
    .header-container {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding-top: 8px;
    }

    .header-logo {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #ffdede;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 11px;
      color: #d32f2f;
      border: 1px solid #ffbaba;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      text-align: center;
      line-height: 1.2;
    }

    .header-title {
      font-size: 20px;
      font-weight: 800;
      color: #111;
    }

    /* 노란색 실시간 알림 버튼 */
    .alert-banner {
      background-color: #ffd600;
      border-radius: 24px;
      padding: 14px;
      text-align: center;
      font-weight: 800;
      font-size: 16px;
      color: #111;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    /* 카테고리 탭 */
    .tab-container {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }

    .tab-btn {
      padding: 10px 22px;
      border-radius: 22px;
      border: none;
      background-color: #ffffff;
      color: #555;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }

    .tab-btn.active {
      background-color: #6b46c1;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(107, 70, 193, 0.3);
    }

    /* 고지문구 */
    .notice-box {
      font-size: 13.5px;
      color: #777;
      line-height: 1.6;
      margin-bottom: 20px;
      padding-left: 2px;
    }

    /* 2열 그리드 배치 */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .card {
      background: #ffffff;
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
      padding: 10px;
    }

    .image-wrapper {
      width: 100%;
      padding-top: 100%;
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      background-color: #f8f9fa;
    }

    .image-wrapper img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .title {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.35;
      margin: 10px 0 8px 0;
      color: #222;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      height: 38px;
    }

    .price-info {
      display: flex;
      align-items: baseline;
      gap: 5px;
      flex-wrap: wrap;
      margin-top: auto;
    }

    .price {
      font-size: 16px;
      font-weight: 800;
      color: #111;
    }

    /* 🔴 빨간색 할인율 스타일 */
    .discount {
      font-size: 15px;
      font-weight: 800;
      color: #eb5757;
    }

    .time-ago {
      font-size: 12px;
      color: #888;
      margin-left: auto;
    }
  </style>
</head>
<body>

  <!-- 1. 헤더 -->
  <div class="header-container">
    <div class="header-logo">핫딜<br>줍줍</div>
    <div class="header-title">오늘의 핫딜 모아보기</div>
  </div>

  <!-- 알림 버튼 -->
  <div class="alert-banner">
    🔥 놓치면 품절! 실시간 알림 받기
  </div>

  <!-- 2. 카테고리 탭 -->
  <div class="tab-container">
    <button class="tab-btn active" onclick="filterDeals('coupang', event)">쿠팡</button>
    <button class="tab-btn" onclick="filterDeals('toss', event)">토스쇼핑</button>
    <button class="tab-btn" onclick="filterDeals('toss_best', event)">토스 BEST50</button>
  </div>

  <!-- 3. 고지문구 -->
  <div class="notice-box" id="notice-content">
    • 이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.<br>
    • 와우회원 카드할인/쿠폰적용가 기준입니다.<br>
    • 품절·가격 변동시 핫딜 종료! 실시간 알림 받고 놓치지 마세요!
  </div>

  <!-- 4. 상품 그리드 -->
  <div class="grid-container" id="deal-list"></div>

  <script>
    let allDeals = [];

    const notices = {
      coupang: `• 이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.<br>• 와우회원 카드할인/쿠폰적용가 기준입니다.<br>• 품절·가격 변동시 핫딜 종료! 실시간 알림 받고 놓치지 마세요!`,
      toss: `• 이 포스팅은 토스쇼핑 쉐어링크 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.<br>• 품절·가격 변동시 핫딜 종료! 실시간 알림 받고 놓치지 마세요!`,
      toss_best: `• 이 포스팅은 토스쇼핑 쉐어링크 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.<br>• 품절·가격 변동시 핫딜 종료! 실시간 알림 받고 놓치지 마세요!`
    };

    function getTimeAgo(dateString) {
      if (!dateString) return '';
      const now = new Date();
      const past = new Date(dateString);
      const diffInMinutes = Math.floor((now - past) / (1000 * 60));

      if (diffInMinutes < 1) return '방금 전';
      if (diffInMinutes < 60) return `${diffInMinutes}분 전`;
      const diffInHours = Math.floor(diffInMinutes / 60);
      if (diffInHours < 24) return `${diffInHours}시간 전`;
      const diffInDays = Math.floor(diffInHours / 24);
      return `${diffInDays}일 전`;
    }

    async function loadDeals() {
      try {
        const response = await fetch('data.json?t=' + new Date().getTime());
        allDeals = await response.json();
        renderDeals(allDeals.filter(d => d.source === 'coupang'));
      } catch (error) {
        console.error('데이터 로드 실패:', error);
      }
    }

    function renderDeals(deals) {
      const container = document.getElementById('deal-list');
      container.innerHTML = '';

      deals.forEach(item => {
        const card = document.createElement('a');
        card.className = 'card';
        card.href = item.link;
        card.target = '_blank';

        // 🔴 할인율 빨간색 무조건 표시 처리
        let discountHtml = '';
        
        // 1) discountRate 필드가 존재할 때
        if (item.discountRate && item.discountRate !== '특가') {
          const digits = item.discountRate.toString().replace(/[^0-9]/g, '');
          if (digits && parseInt(digits) > 0) {
            discountHtml = `<span class="discount">▼${digits}%</span>`;
          }
        }

        // 2) 원가와 할인가가 존재할 때 정밀 자동 계산
        if (!discountHtml && item.originalPrice && item.price) {
          const orig = parseInt(item.originalPrice.replace(/[^0-9]/g, ''));
          const sale = parseInt(item.price.replace(/[^0-9]/g, ''));
          if (orig > sale && orig > 0) {
            const calculated = Math.round((1 - (sale / orig)) * 100);
            if (calculated > 0) {
              discountHtml = `<span class="discount">▼${calculated}%</span>`;
            }
          }
        }

        const timeAgoStr = getTimeAgo(item.createdAt);

        card.innerHTML = `
          <div class="image-wrapper">
            <img src="${item.imageUrl}" alt="${item.title}" loading="lazy">
          </div>
          <div class="title">${item.title}</div>
          <div class="price-info">
            <span class="price">${item.price}</span>
            ${discountHtml}
            <span class="time-ago">${timeAgoStr}</span>
          </div>
        `;

        container.appendChild(card);
      });
    }

    function filterDeals(source, event) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (event && event.target) {
        event.target.classList.add('active');
      }

      document.getElementById('notice-content').innerHTML = notices[source] || notices.coupang;

      let filtered = [];
      if (source === 'coupang') {
        filtered = allDeals.filter(d => d.source === 'coupang');
      } else if (source === 'toss' || source === 'toss_best') {
        filtered = allDeals.filter(d => d.source === 'toss');
      } else {
        filtered = allDeals;
      }

      renderDeals(filtered);
    }

    loadDeals();
  </script>
</body>
</html>
