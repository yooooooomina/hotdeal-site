<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실시간 핫딜 알림</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #eef0f5;
      color: #333;
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
    }

    /* 상단 카테고리 탭 버튼 */
    .tab-container {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .tab-btn {
      padding: 10px 20px;
      border-radius: 20px;
      border: none;
      background-color: #ffffff;
      color: #555;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }

    .tab-btn.active {
      background-color: #6b46c1;
      color: #ffffff;
    }

    /* 안내 문구 */
    .notice-box {
      font-size: 13px;
      color: #666;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    /* 🔥 핫딜 그리드: 무조건 한 줄에 2개씩 크게배치 */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .card {
      background: #ffffff;
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      padding: 10px;
    }

    /* 🖼️ 이미지 확대 (정사각형 꽉 차게) */
    .image-wrapper {
      width: 100%;
      padding-top: 100%; /* 1:1 비율 */
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      background-color: #f8f9fa;
    }

    .image-wrapper img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .title {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.35;
      margin: 10px 0 8px 0;
      color: #222;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      height: 38px;
    }

    /* 💰 가격, 할인율, 업로드 시간 정보 */
    .price-info {
      display: flex;
      align-items: baseline;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: auto;
    }

    .price {
      font-size: 17px;
      font-weight: 800;
      color: #111;
    }

    .discount {
      font-size: 15px;
      font-weight: 700;
      color: #eb5757; /* 스크린샷과 동일한 빨간색 */
    }

    .time-ago {
      font-size: 12px;
      color: #888;
      margin-left: auto;
    }
  </style>
</head>
<body>

  <!-- 카테고리 탭 -->
  <div class="tab-container">
    <button class="tab-btn active" onclick="filterDeals('all')">전체</button>
    <button class="tab-btn" onclick="filterDeals('coupang')">쿠팡</button>
    <button class="tab-btn" onclick="filterDeals('toss')">토스쇼핑</button>
  </div>

  <!-- 안내 문구 -->
  <div class="notice-box">
    • 이 포스팅은 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.<br>
    • 품절·가격 변동 시 핫딜 종료! 실시간 알림 받고 놓치지 마세요!
  </div>

  <!-- 핫딜 목록 카드 (2개씩 배치) -->
  <div class="grid-container" id="deal-list"></div>

  <script>
    let allDeals = [];

    // 상대 시간 계산 함수 (예: 28분 전, 1시간 전)
    function getTimeAgo(dateString) {
      if (!dateString) return '';
      const now = new Date();
      const past = new Date(dateString);
      const diffInMinutes = Math.floor((now - past) / (1000 * 60));

      if (diffInMinutes < 1) return '방금 전';
      if (diffInMinutes < 60) return `${diffInMinutes}분 전`;
      const diffInHours = Math.floor(diffInMinutes / 60);
      if (diffInHours < 24) return `${diffInHours}시간 전`;
      const diffInDays = Math.floor(diffInHours / 24);
      return `${diffInDays}일 전`;
    }

    // 데이터 로드
    async function loadDeals() {
      try {
        const response = await fetch('data.json?t=' + new Date().getTime());
        allDeals = await response.json();
        renderDeals(allDeals);
      } catch (error) {
        console.error('데이터 로드 실패:', error);
      }
    }

    // 카드 출력 함수
    function renderDeals(deals) {
      const container = document.getElementById('deal-list');
      container.innerHTML = '';

      deals.forEach(item => {
        const card = document.createElement('a');
        card.className = 'card';
        card.href = item.link;
        card.target = '_blank';

        // 할인율 표시 로직 (▼00%)
        let discountHtml = '';
        if (item.discountRate) {
          const rateNum = item.discountRate.replace('%', '').replace('▼', '');
          if (rateNum && !isNaN(rateNum)) {
            discountHtml = `<span class="discount">▼${rateNum}%</span>`;
          }
        }

        const timeAgoStr = getTimeAgo(item.createdAt);

        card.innerHTML = `
          <div class="image-wrapper">
            <img src="${item.imageUrl}" alt="${item.title}" loading="lazy">
          </div>
          <div class="title">${item.title}</div>
          <div class="price-info">
            <span class="price">${item.price}</span>
            ${discountHtml}
            <span class="time-ago">${timeAgoStr}</span>
          </div>
        `;

        container.appendChild(card);
      });
    }

    // 탭 필터링
    function filterDeals(source) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      if (source === 'all') {
        renderDeals(allDeals);
      } else {
        const filtered = allDeals.filter(d => d.source === source);
        renderDeals(filtered);
      }
    }

    loadDeals();
  </script>
</body>
</html>
